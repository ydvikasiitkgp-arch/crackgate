name: Sync feat — ahead of main

# Runs when `feat` is AHEAD of `main`: every 8 hours opens a PR (feat → main)
# and merges it so `main` tracks `feat`.
#
# NOTE: the `schedule` trigger only fires when this file exists on the default
# branch (`main`), so this becomes active once merged there. Until then use
# `workflow_dispatch`.

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

concurrency:
  group: sync-feat-ahead
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'iamyadavvikas/crackgate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Determine if feat is ahead of main
        id: ahead
        run: |
          git fetch origin main:refs/remotes/origin/main feat:refs/remotes/origin/feat
          MAIN_ONLY=$(git rev-list --count origin/feat..origin/main 2>/dev/null || echo 0)
          FEAT_ONLY=$(git rev-list --count origin/main..origin/feat 2>/dev/null || echo 0)
          echo "main_only=${MAIN_ONLY}" >> "$GITHUB_OUTPUT"
          echo "feat_only=${FEAT_ONLY}" >> "$GITHUB_OUTPUT"
          echo "main_only=${MAIN_ONLY} feat_only=${FEAT_ONLY}"
          if [ "${FEAT_ONLY}" -gt 0 ] && [ "${MAIN_ONLY}" -eq 0 ]; then
            echo "state=ahead" >> "$GITHUB_OUTPUT"
          elif [ "${FEAT_ONLY}" -gt 0 ] && [ "${MAIN_ONLY}" -gt 0 ]; then
            echo "state=diverged" >> "$GITHUB_OUTPUT"
          else
            echo "state=in-sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR if none open
        if: steps.ahead.outputs.state == 'ahead'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --repo "${{ github.repository }}" \
            --base main --head feat --state open --json number \
            --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING}" ]; then
            echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            NUMBER=$(gh pr create --repo "${{ github.repository }}" \
              --base main --head feat \
              --title "Sync feat into main" \
              --body "Automated sync: \`feat\` is ahead of \`main\` by ${{ steps.ahead.outputs.feat_only }} commit(s)." \
              --json number --jq '.number')
            if [ -z "${NUMBER}" ]; then
              echo "::error::gh pr create returned no PR number — PR creation failed"
              exit 1
            fi
            echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge PR
        if: steps.ahead.outputs.state == 'ahead' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --repo "${{ github.repository }}" "${{ steps.pr.outputs.number }}" --merge

      - name: Notify on divergence
        if: steps.ahead.outputs.state == 'diverged'
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"text":":warning: `feat` and `main` have diverged — manual sync required."}'

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"text":":rotating_light: Sync feat (ahead of main) workflow failed."}'
