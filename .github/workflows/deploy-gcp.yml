name: Deploy to GCP

# Manual-only. Nothing runs until a human dispatches it — GCP has no branch
# push/schedule triggers, so a deploy can never surprise you mid-cycle.
#
# Required GitHub repo secrets:
#   GCP_SSH_KEY        private ed25519 key for the `deploy` user on the VM
#   GCP_HOST           external IP or DNS name of the GCP VM
#   GCP_DEPLOY_USER    optional; defaults to `deploy`
#   GHCR_USERNAME      any GitHub username (image pull on the VM)
#   GHCR_TOKEN         PAT with read:packages (image pull on the VM) — the
#                      GITHUB_TOKEN used to push in CI does not work on the box
#   NEXT_PUBLIC_POSTHOG_KEY, NEXT_PUBLIC_SENTRY_DSN (build-time, if used)
#
# Required GitHub repo variables:
#   GCP_URL            e.g. https://crackgate.in — Playwright smoke target
#   NEXT_PUBLIC_*      same build-args as deploy.yml (Google, WhatsApp, Razorpay)
#   ADMIN_EMAILS, ADMIN_SHAREHOLDER_EMAILS (synced onto the VM each deploy)
#
# Other app secrets (POSTGRES_PASSWORD, AUTH_SECRET, GOOGLE_*, RAZORPAY_*,
# RESEND_API_KEY, IMPERSONATE_SECRET, ...) live in /opt/crackgate/.env.production
# on the VM, provisioned once after scripts/gcp-bootstrap.sh — same model as
# the VPS flow. Only the values listed in remote-deploy-cloud.sh are synced
# from CI.

on:
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: "Skip prisma migrate deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/crackgate-gcp-web

jobs:
  # ─── Lint + typecheck + unit tests — fail fast before the build ───────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --workspace @crackgate/database prisma generate
      - run: npm run --workspace apps/web lint
      - run: npm run --workspace apps/web typecheck
      - run: npm run --workspace apps/web test
      - name: npm audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high || true

  # ─── Build linux/amd64 image (matches the GCP VM) and push to GHCR ────────
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write       # push image to ghcr.io
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - id: meta
        run: |
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.GHCR_REPO }}:latest
          no-cache: true
          build-args: |
            NEXT_PUBLIC_GOOGLE_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_ENABLED }}
            NEXT_PUBLIC_WHATSAPP_ENABLED=${{ vars.NEXT_PUBLIC_WHATSAPP_ENABLED }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
            NEXT_PUBLIC_WHATSAPP_COMMUNITY_URL=${{ vars.NEXT_PUBLIC_WHATSAPP_COMMUNITY_URL }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_UPI_VPA=${{ vars.NEXT_PUBLIC_UPI_VPA }}
            NEXT_PUBLIC_UPI_PAYEE_NAME=${{ vars.NEXT_PUBLIC_UPI_PAYEE_NAME }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  # ─── SSH to the GCP VM: copy files, then run the shared deploy script ─────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: gcp
    steps:
      - uses: actions/checkout@v6

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose + Caddyfile + deploy script
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            docker-compose.cloud.yml Caddyfile \
            ${{ secrets.GCP_DEPLOY_USER || 'deploy' }}@${{ secrets.GCP_HOST }}:/opt/crackgate/
          scp -i ~/.ssh/id_ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            scripts/remote-deploy-cloud.sh \
            ${{ secrets.GCP_DEPLOY_USER || 'deploy' }}@${{ secrets.GCP_HOST }}:/opt/crackgate/scripts/

      - name: Deploy
        timeout-minutes: 30
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate || 'false' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ADMIN_SHAREHOLDER_EMAILS: ${{ vars.ADMIN_SHAREHOLDER_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          IMPERSONATE_SECRET: ${{ secrets.IMPERSONATE_SECRET }}
        run: |
          # Secrets ride over SSH stdin (heredoc), never on the remote
          # command line, so they don't show up in ps/argv on the VM.
          # shellcheck disable=SC2087 # runner expands step env vars client-side, intentionally
          ssh -i ~/.ssh/id_ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.GCP_DEPLOY_USER || 'deploy' }}@${{ secrets.GCP_HOST }} \
            bash -se <<EOF
            export GHCR_REPO="${{ env.GHCR_REPO }}" \
                   IMAGE_TAG="${IMAGE_TAG}" SKIP_MIGRATE="${SKIP_MIGRATE}" \
                   GHCR_USERNAME="${GHCR_USERNAME}" GHCR_TOKEN="${GHCR_TOKEN}" \
                   ADMIN_EMAILS="${ADMIN_EMAILS}" \
                   ADMIN_SHAREHOLDER_EMAILS="${ADMIN_SHAREHOLDER_EMAILS}" \
                   RESEND_API_KEY="${RESEND_API_KEY}" \
                   IMPERSONATE_SECRET="${IMPERSONATE_SECRET}"
            bash /opt/crackgate/scripts/remote-deploy-cloud.sh
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: CrackGate GCP deploy failed — ${{ github.sha }}\"}"

  # ─── Post-deploy smoke test against the GCP-hosted site ───────────────────
  smoke:
    needs: deploy
    if: ${{ vars.GCP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --workspace apps/web playwright install --with-deps chromium
      - name: Smoke test
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.GCP_URL }}
        run: npm run --workspace apps/web test:e2e

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: CrackGate GCP smoke test failed — ${{ github.sha }}\"}"
